<!DOCTYPE html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"brand-ground","type":"color","label":"Background","default":"#08080A"},
    {"id":"brand-ink","type":"color","label":"Text","default":"#F5F2ED"},
    {"id":"brand-accent","type":"color","label":"Accent","default":"#CE1141"},
    {"id":"font-display","type":"string","label":"Display font","default":"Bebas Neue"},
    {"id":"font-body","type":"string","label":"Body font","default":"Outfit"}
  ]'
>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Play-Maker — iPhone Tour</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #08080A; overflow: hidden; }
    #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  </style>
</head>
<body>
  <div
    id="root"
    data-composition-id="main"
    data-start="0"
    data-duration="24"
    data-width="1920"
    data-height="1080"
  >
    <div
      id="tour"
      data-composition-id="tour"
      data-composition-src="compositions/tour.html"
      data-start="0"
      data-duration="24"
      data-track-index="1"
      data-track-kind="graphics"
      data-width="1920"
      data-height="1080"
    ></div>

    <audio
      id="bgm"
      class="clip"
      data-start="0"
      data-duration="24"
      data-track-index="2"
      data-volume="0.30"
      data-fade-in="0.8"
      data-fade-out="1.2"
      preload="auto"
    >
      <source src="assets/audio/bgm-24s.mp3" type="audio/mpeg">
    </audio>

    <audio
      id="vo-main"
      class="clip"
      data-start="0.25"
      data-duration="17.568"
      data-track-index="3"
      data-volume="1"
      preload="auto"
    >
      <source src="assets/audio/narration-main-norm.mp3" type="audio/mpeg">
    </audio>

    <audio
      id="vo-cta"
      class="clip"
      data-start="18.55"
      data-duration="2.088"
      data-track-index="4"
      data-volume="1"
      preload="auto"
    >
      <source src="assets/audio/narration-cta-norm.mp3" type="audio/mpeg">
    </audio>

    <audio
      id="sfx-cut-1"
      class="clip"
      data-start="4.70"
      data-duration="0.575"
      data-track-index="5"
      data-volume="0.32"
      preload="auto"
    >
      <source src="assets/sfx/whoosh.mp3" type="audio/mpeg">
    </audio>

    <audio
      id="sfx-cut-2"
      class="clip"
      data-start="9.45"
      data-duration="0.575"
      data-track-index="6"
      data-volume="0.32"
      preload="auto"
    >
      <source src="assets/sfx/whoosh.mp3" type="audio/mpeg">
    </audio>

    <audio
      id="sfx-cut-3"
      class="clip"
      data-start="12.45"
      data-duration="0.575"
      data-track-index="7"
      data-volume="0.32"
      preload="auto"
    >
      <source src="assets/sfx/whoosh.mp3" type="audio/mpeg">
    </audio>

    <audio
      id="sfx-stats"
      class="clip"
      data-start="5.50"
      data-duration="0.720"
      data-track-index="8"
      data-volume="0.26"
      preload="auto"
    >
      <source src="assets/sfx/pop.mp3" type="audio/mpeg">
    </audio>

    <audio
      id="sfx-tap"
      class="clip"
      data-start="13.52"
      data-duration="0.366"
      data-track-index="9"
      data-volume="0.24"
      preload="auto"
    >
      <source src="assets/sfx/click-soft.mp3" type="audio/mpeg">
    </audio>

    <audio
      id="sfx-end"
      class="clip"
      data-start="17.55"
      data-duration="0.575"
      data-track-index="10"
      data-volume="0.26"
      preload="auto"
    >
      <source src="assets/sfx/whoosh.mp3" type="audio/mpeg">
    </audio>

    <audio
      id="sfx-chime"
      class="clip"
      data-start="17.95"
      data-duration="2.500"
      data-track-index="11"
      data-volume="0.28"
      preload="auto"
    >
      <source src="assets/sfx/chime.mp3" type="audio/mpeg">
    </audio>
  </div>

  <script>
    window.__timelines["main"] = gsap.timeline({ paused: true });
  </script>
</body>
</html>
