<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Basketball Stats Tracker — Product Presentation</title>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&display=swap');
    body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0a0a0a; }
    #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: 'Inter', sans-serif; color: #fff; }

    .bg { position: absolute; inset: 0; background: #0a0a0a; }

    .scene {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 16px; overflow: hidden;
      box-shadow: 0 24px 70px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.07);
    }
    .scene img { display: block; width: 100%; height: 100%; object-fit: contain; background: #111; }

    #s1 {
      width: 1600px; height: 820px;
      border-radius: 20px;
      box-shadow: 0 30px 90px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.08);
    }
    #s2 { width: 1280px; height: 720px; }
    #s3 { width: 1280px; height: 720px; }
    #s4 { width: 1280px; height: 720px; }
    #s5 { width: 1400px; height: 788px; }

    #caption {
      position: absolute; bottom: 36px; left: 50%;
      z-index: 20; display: flex; align-items: center; gap: 12px;
      background: rgba(10,10,10,0.9); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.08); border-radius: 10px;
      padding: 12px 28px;
    }
    .tag {
      background: #CE1141; color: #fff; font-size: 12px; font-weight: 700;
      padding: 5px 12px; border-radius: 5px; text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .text { font-size: 20px; font-weight: 500; color: rgba(255,255,255,0.85); }

    #poster-title {
      position: absolute; bottom: 80px; left: 50%; z-index: 10;
      text-align: center; transform: translateX(-50%);
    }
    #poster-title h1 {
      font-family: 'Bebas Neue', sans-serif; font-size: 72px; line-height: 1.1;
      letter-spacing: 0.04em; text-transform: uppercase; margin: 0;
      background: rgba(206,17,65,0.9); display: inline-block;
      padding: 12px 36px; border-radius: 8px;
    }
    #poster-title p {
      font-size: 28px; font-weight: 600; color: #fff; margin: 14px 0 0 0;
      background: rgba(0,0,0,0.8); display: inline-block;
      padding: 10px 28px; border-radius: 6px;
      letter-spacing: 0.02em;
    }

    /* Final scene */
    #s5-wrap {
      position: absolute; top: 50%; left: 50%;
    }
    #s5-glow {
      position: absolute; inset: -100px; z-index: -1;
      background: radial-gradient(ellipse at center, rgba(206,17,65,0.3) 0%, transparent 70%);
      opacity: 0; border-radius: 50%;
    }

    /* Black pixel / iris transition */
    #black-iris {
      position: absolute; inset: 0; z-index: 50;
      background: #0a0a0a;
      clip-path: circle(0% at 50% 50%);
      pointer-events: none;
    }

    .vignette {
      position: absolute; inset: 0; z-index: 40; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.45) 100%);
    }
    #vignette-intense {
      position: absolute; inset: 0; z-index: 41; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.7) 100%);
      opacity: 0;
    }

    #sweep {
      position: absolute; inset: 0; z-index: 7; pointer-events: none;
      background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.1) 50%, transparent 60%);
      opacity: 0;
    }
  </style>
</head>
<body>
<div data-hf-id="hf-x47n" id="root" data-composition-id="basketball-promo" data-width="1920" data-height="1080" data-duration="16">

  <div data-hf-id="hf-m7dd" class="bg"></div>

  <!-- 1: bulls-bg (0–2s) -->
  <div data-hf-id="hf-1qs7" id="s1" class="scene" style="z-index:1;">
    <img data-hf-id="hf-zp6e" src="screenshots/bulls-bg.png" alt="Chicago Bulls Court">
  </div>
  <div data-hf-id="hf-yunx" id="poster-title" style="z-index:2;">
    <h1 data-hf-id="hf-2qvy">Basketball Stats Tracker</h1>
    <p data-hf-id="hf-8a66">Real time analytics for every game</p>
  </div>

  <!-- 2: Full Screen (2–6s) -->
  <div data-hf-id="hf-4fzi" id="s2" class="scene" style="opacity:0; z-index:3;">
    <img data-hf-id="hf-ghkq" src="screenshots/Bulls Utah 97 - Full Screen.png" alt="Full Screen">
  </div>

  <!-- 3: Game Summary (6–9s) -->
  <div data-hf-id="hf-wgq2" id="s3" class="scene" style="opacity:0; z-index:4;">
    <img data-hf-id="hf-a5um" src="screenshots/Bulls Utah 97 - Game Summary.png" alt="Game Summary">
  </div>

  <!-- 4: Team Settings (9–12s) -->
  <div data-hf-id="hf-q5g2" id="s4" class="scene" style="opacity:0; z-index:5;">
    <img data-hf-id="hf-n7w2" src="screenshots/Bulls Utah 97 - Team Settings.png" alt="Team Settings">
  </div>

  <!-- 5: bulls-bg 2 (12–15s) -->
  <div data-hf-id="hf-w2q2" id="s5-wrap" style="opacity:0; z-index:6;">
    <div data-hf-id="hf-gkvx" id="s5-glow"></div>
    <div data-hf-id="hf-lwhy" id="s5" class="scene">
      <img data-hf-id="hf-aia4" src="screenshots/bulls-bg 2.png" alt="Bulls Court">
    </div>
  </div>

  <div data-hf-id="hf-1yur" id="sweep"></div>
  <div data-hf-id="hf-4uq6" id="black-iris"></div>

  <!-- Audio -->
  <audio data-hf-id="hf-coe6" id="bgm" data-start="0" data-duration="16" preload="auto">
    <source data-hf-id="hf-golq" src="audio/bgm.mp3" type="audio/mpeg">
  </audio>

  <div data-hf-id="hf-n575" id="caption" style="opacity:0; z-index:20;">
    <span data-hf-id="hf-17mv" class="tag" id="cap-tag">Overview</span>
    <span data-hf-id="hf-ix1q" class="text" id="cap-text">Welcome</span>
  </div>

  <div data-hf-id="hf-q7bi" class="vignette"></div>
  <div data-hf-id="hf-r7ji" id="vignette-intense"></div>
</div>

<script>
(function () {
  "use strict";

  var labels = [
    { tag: "Overview", text: "Chicago Bulls Court" },
    { tag: "Live View", text: "Full game view — players, scores, actions" },
    { tag: "Summary", text: "Game summary — full box score breakdown" },
    { tag: "Settings", text: "Team settings — names, numbers, details" },
    { tag: "Chicago Bulls", text: "Built for the game" },
  ];

  var tl = gsap.timeline({ paused: true });

  /* ── Audio: volume set (fades baked into file) ────────────── */
  tl.set("#bgm", { volume: 1.0 }, 0);

  /* ── S1: bulls-bg  0 → 2s ─────────────────────────────────── */
  tl.from("#poster-title h1", { y: 30, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.3);
  tl.from("#poster-title p", { y: 20, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.6);

  tl.add(function () {
    document.getElementById("cap-tag").textContent = labels[0].tag;
    document.getElementById("cap-text").textContent = labels[0].text;
  }, 0.5);
  tl.fromTo("#caption",
    { opacity: 0, y: 15, xPercent: -50 },
    { opacity: 1, y: 0, xPercent: -50, duration: 0.4, ease: "power2.out", immediateRender: false },
    0.5
  );

  /* ── S1 → S2: crossfade ───────────────────────────────────── */
  tl.to("#poster-title", { opacity: 0, duration: 0.4, ease: "power2.in" }, 1.7);
  tl.to("#caption", { opacity: 0, xPercent: -50, duration: 0.3, ease: "power2.in" }, 1.8);
  tl.to("#s1", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 1.8);
  tl.set("#s2", { opacity: 0 }, 1.8);
  tl.to("#s2", { opacity: 1, duration: 0.6, ease: "power2.inOut" }, 1.8);
  tl.add(function () {
    document.getElementById("cap-tag").textContent = labels[1].tag;
    document.getElementById("cap-text").textContent = labels[1].text;
  }, 2.1);
  tl.fromTo("#caption",
    { opacity: 0, y: 15, xPercent: -50 },
    { opacity: 1, y: 0, xPercent: -50, duration: 0.4, ease: "power2.out", immediateRender: false },
    2.1
  );

  /* ── S2 → S3: crossfade ───────────────────────────────────── */
  tl.to("#caption", { opacity: 0, xPercent: -50, duration: 0.3, ease: "power2.in" }, 5.6);
  tl.to("#s2", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 5.7);
  tl.set("#s3", { opacity: 0 }, 5.7);
  tl.to("#s3", { opacity: 1, duration: 0.6, ease: "power2.inOut" }, 5.7);
  tl.add(function () {
    document.getElementById("cap-tag").textContent = labels[2].tag;
    document.getElementById("cap-text").textContent = labels[2].text;
  }, 6.0);
  tl.fromTo("#caption",
    { opacity: 0, y: 15, xPercent: -50 },
    { opacity: 1, y: 0, xPercent: -50, duration: 0.4, ease: "power2.out", immediateRender: false },
    6.0
  );

  /* ── S3 → S4: crossfade ───────────────────────────────────── */
  tl.to("#caption", { opacity: 0, xPercent: -50, duration: 0.3, ease: "power2.in" }, 8.6);
  tl.to("#s3", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 8.7);
  tl.set("#s4", { opacity: 0 }, 8.7);
  tl.to("#s4", { opacity: 1, duration: 0.6, ease: "power2.inOut" }, 8.7);
  tl.add(function () {
    document.getElementById("cap-tag").textContent = labels[3].tag;
    document.getElementById("cap-text").textContent = labels[3].text;
  }, 9.0);
  tl.fromTo("#caption",
    { opacity: 0, y: 15, xPercent: -50 },
    { opacity: 1, y: 0, xPercent: -50, duration: 0.4, ease: "power2.out", immediateRender: false },
    9.0
  );

  /* ── S4 → S5: crossfade + continuous push-in  12s ─────────── */
  tl.to("#caption", { opacity: 0, xPercent: -50, duration: 0.3, ease: "power2.in" }, 11.6);
  tl.to("#s4", { opacity: 0, duration: 0.6, ease: "power2.inOut" }, 11.7);

  /* S5: one continuous zoom from small to massive, no stops */
  tl.set("#s5-wrap", { opacity: 0, scale: 0.4, xPercent: -50, yPercent: -50 }, 11.7);
  tl.to("#s5-wrap", {
    opacity: 1, scale: 3.0,
    xPercent: -50, yPercent: -50,
    duration: 4.3, ease: "power2.in",
    overwrite: "auto"
  }, 11.7);

  /* Glow grows continuously */
  tl.to("#s5-glow", { opacity: 1, scale: 2.0, duration: 4.3, ease: "power2.in", overwrite: "auto" }, 11.7);

  /* Vignette darkens progressively */
  tl.to("#vignette-intense", { opacity: 0.8, duration: 4.0, ease: "power2.in" }, 12.0);

  /* Light sweep */
  tl.set("#sweep", { x: -1920 }, 12.2);
  tl.to("#sweep", { x: 1920, duration: 0.8, ease: "power2.inOut" }, 12.2);

  /* Black iris: late entry, expands while zoom continues */
  tl.to("#black-iris", {
    clipPath: "circle(110% at 50% 50%)",
    duration: 1.2,
    ease: "power2.inOut"
  }, 14.8);

  /* Caption */
  tl.add(function () {
    document.getElementById("cap-tag").textContent = labels[4].tag;
    document.getElementById("cap-text").textContent = labels[4].text;
  }, 12.3);
  tl.fromTo("#caption",
    { opacity: 0, y: 15, xPercent: -50 },
    { opacity: 1, y: 0, xPercent: -50, duration: 0.4, ease: "power2.out", immediateRender: false },
    12.3
  );
  tl.to("#caption", { opacity: 0, duration: 0.3, ease: "power2.in" }, 14.5);

  window.__timelines["basketball-promo"] = tl;
})();
</script>
</body>
</html>
